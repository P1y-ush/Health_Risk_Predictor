filebeat.inputs:
- type: container
  paths:
    - '/var/lib/docker/containers/*/*.log'
  processors:
    - add_docker_metadata:
        host: "unix:///var/run/docker.sock"

- type: log
  enabled: true
  paths:
    - '/var/log/*.log'

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: false

version: '3.8'

services:
  health-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health-risk-predictor
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=info
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-net

volumes:
  app_logs:

networks:
  app-net:
    driver: bridge
